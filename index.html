<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Next360 CEO Command Center</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        :root{--forest:#173F35;--forest-dark:#0F2D26;--green:#2F6658;--cream:#F8F6F1;--white:#FFFFFF;--gold:#C9A227;--gold-soft:#E8D48B;--success:#3E8E68;--danger:#C94A4A;--text:#1A1A1A;--text-secondary:#6B7280;--border:#E5E7EB;--shadow-lg:0 10px 30px rgba(0,0,0,.08)}
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:'Inter',sans-serif;background:var(--cream);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
        body::before{content:'';position:absolute;top:-200px;right:-150px;width:500px;height:500px;background:radial-gradient(circle,rgba(23,63,53,.06) 0%,transparent 70%);border-radius:50%}
        body::after{content:'';position:absolute;bottom:-150px;left:-100px;width:400px;height:400px;background:radial-gradient(circle,rgba(201,162,39,.06) 0%,transparent 70%);border-radius:50%}

        .landing{position:relative;z-index:1;text-align:center;padding:40px 20px;max-width:480px;width:100%}
        .logo{width:72px;height:72px;border-radius:18px;margin-bottom:24px;filter:drop-shadow(0 4px 12px rgba(23,63,53,.15))}
        .brand{font-size:28px;font-weight:800;color:var(--forest);letter-spacing:-.5px;margin-bottom:4px}
        .tagline{font-size:14px;color:var(--text-secondary);margin-bottom:40px}

        .ceo-card{background:var(--white);border-radius:20px;padding:32px 28px;box-shadow:var(--shadow-lg);border:1px solid rgba(0,0,0,.04);margin-bottom:40px}
        .ceo-avatar{width:80px;height:80px;border-radius:50%;border:3px solid var(--gold);margin:0 auto 12px;display:block;object-fit:cover}
        .ceo-name{font-size:18px;font-weight:700;color:var(--forest);margin-bottom:2px}
        .ceo-role{font-size:13px;color:var(--text-muted)}

        .buttons{display:flex;flex-direction:column;gap:14px}
        .btn-landing{display:flex;align-items:center;justify-content:center;gap:10px;padding:18px 28px;border-radius:14px;font-size:16px;font-weight:700;text-decoration:none;transition:all .25s cubic-bezier(.4,0,.2,1);cursor:pointer;border:none;width:100%}
        .btn-landing:hover{transform:translateY(-2px)}

        .btn-book{background:var(--gold);color:var(--forest-dark);box-shadow:0 4px 15px rgba(201,162,39,.25)}
        .btn-book:hover{box-shadow:0 8px 25px rgba(201,162,39,.35);background:var(--gold);color:var(--forest-dark)}

        .btn-login{background:var(--forest);color:#fff;box-shadow:0 4px 15px rgba(23,63,53,.2)}
        .btn-login:hover{box-shadow:0 8px 25px rgba(23,63,53,.3);background:var(--forest-dark);color:#fff}

        .btn-icon{font-size:20px}

        .footer{position:relative;z-index:1;text-align:center;padding:24px;font-size:12px;color:var(--text-muted);margin-top:auto}

        @media(max-width:520px){
            .landing{padding:30px 16px}
            .brand{font-size:24px}
            .ceo-card{padding:24px 20px}
        }
    </style>
</head>
<body>
    <div class="landing">
        <img src="img/logo.png" alt="Next360" class="logo">
        <h1 class="brand">Next360</h1>
        <p class="tagline">CEO Command Center — Organic Products</p>

        <div class="ceo-card">
            <img src="img/ceo.png" alt="CEO" class="ceo-avatar">
            <div class="ceo-name">Samhith</div>
            <div class="ceo-role">Chief Executive Officer</div>
        </div>

        <div class="buttons">
            <a href="book.html" class="btn-landing btn-book">
                <i class="bi bi-calendar-plus btn-icon"></i> Book a Meeting
            </a>
            <a href="login.html" class="btn-landing btn-login">
                <i class="bi bi-shield-lock btn-icon"></i> Admin Login
            </a>
        </div>
    </div>
    <div class="footer">&copy; 2026 Next360 — All rights reserved</div>
</body>
</html>
